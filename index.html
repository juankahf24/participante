const APP_VERSION="offline-safe-2026-05";
const JSQR_CACHE_KEY="militopo_jsqr_cache_v1";
function safeNow(){return new Date().toISOString()}
function baseKey(){return "militopo_runner_"+EVENT_DATA.eventId}
function allRecoveryKeys(p){return [baseKey()+"_"+p,baseKey(),baseKey()+"_backup_"+p,baseKey()+"_backup_last",baseKey()+"_emergency_"+p,baseKey()+"_emergency_last"]}
function normalizeLog(x){
    if(!x||typeof x!=="object")return null;
    if(!x.eventId)x.eventId=EVENT_DATA.eventId;
    if(!Array.isArray(x.scans))x.scans=[];
    if(!Array.isArray(x.missingControls))x.missingControls=[];
    return x;
}
function chooseBestLog(candidates){
    const valid=candidates.map(x=>normalizeLog(x)).filter(Boolean);
    if(!valid.length)return null;
    valid.sort((a,b)=>{
        const as=(a.scans||[]).length+(a.startTime?1:0)+(a.finishTime?2:0);
        const bs=(b.scans||[]).length+(b.startTime?1:0)+(b.finishTime?2:0);
        if(as!==bs)return bs-as;
        return String(b.lastSavedAt||"").localeCompare(String(a.lastSavedAt||""));
    });
    return valid[0];
}
function readJsonKey(k){try{const raw=localStorage.getItem(k)||sessionStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function writeKeyEverywhere(k,raw){try{localStorage.setItem(k,raw)}catch(e){} try{sessionStorage.setItem(k,raw)}catch(e){}}
function storageHealth(){

function updateOfflineSafetyPanel(msg){
    const p=document.getElementById("offlineSafetyPanel");if(!p)return;
    const ok=storageHealth();
    const saved=log&&log.lastSavedAt?new Date(log.lastSavedAt).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"--";
    p.style.display="block";

    p.innerHTML=(msg?("<b>"+msg+"</b><br>"):"")+"Modo offline preparado · guardado local: "+saved+"<br><span class='small'>Puedes perder cobertura o recargar: el recorrido se restaurará desde este móvil.</span><div class='recovery-actions'><button class='btn secondary' onclick='restoreBestSavedRun()'>♻️ RECUPERAR RECORRIDO GUARDADO</button><button class='btn secondary' onclick='showPartialResultQr()'>🆘 MOSTRAR QR DE RESCATE PARCIAL</button></div>";
}
async function precacheQrReader(){
    if(window.jsQR)return true;
    try{
        const cached=localStorage.getItem(JSQR_CACHE_KEY);
        if(cached){(new Function(cached))(); if(window.jsQR)return true;}
    }catch(e){}
    try{
        if(!navigator.onLine)return false;
        const r=await fetch("https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js",{cache:"force-cache"});
        if(r.ok){
            const code=await r.text();
            localStorage.setItem(JSQR_CACHE_KEY,code);
            (new Function(code))();
            return !!window.jsQR;
        }
    }catch(e){}
    return false;
}
function init(){
    document.getElementById("eventInfo").innerHTML="Evento: <b>"+EVENT_DATA.eventId+"</b><br>"+(EVENT_DATA.eventName||"Orientación");

    updateOfflineSafetyPanel("APP LISTA PARA TRABAJAR SIN COBERTURA");
    precacheQrReader().then(ok=>{if(ok)updateOfflineSafetyPanel("LECTOR QR PREPARADO OFFLINE");});
}

function parse(raw){const p=String(raw||"").trim().split("|");if(p.length>=4&&p[0].toUpperCase()==="ORI")return{ok:true,type:p[1].toUpperCase(),eventId:p[2],id:p[3],routeId:p[4]||""};return{ok:false}}
function handleQr(raw){const q=parse(raw);if(!q.ok)return toast("QR no válido");if(q.eventId!==EVENT_DATA.eventId)return toast("QR de otro evento");if(q.type==="PARTICIPANT")return loadParticipant(q);if(q.type==="CONTROL")return scanControl(q.id);toast("QR no reconocido")}
function loadParticipant(q){route=EVENT_DATA.routes.find(r=>r.participantId===q.id&&(!q.routeId||r.routeId===q.routeId));if(!route)return toast("Participante no encontrado");pid=route.participantId;const candidates=allRecoveryKeys(pid).map(readJsonKey);log=chooseBestLog(candidates);if(!log)log={eventId:EVENT_DATA.eventId,participantId:pid,routeId:route.routeId,startTime:null,finishTime:null,scans:[],completed:false,missingControls:[]};log.participantId=pid;log.routeId=route.routeId;save();renderLoaded();toast("Recorrido cargado y guardado offline")}

function restoreBestSavedRun(silent){
    const guesses=[];
    try{guesses.push(readJsonKey(key()),readJsonKey(key()+"_backup_last"),readJsonKey(key()+"_emergency_last"))}catch(e){}
    (EVENT_DATA.routes||[]).forEach(r=>allRecoveryKeys(r.participantId).forEach(k=>guesses.push(readJsonKey(k))));
    const best=chooseBestLog(guesses);
    if(!best){if(!silent)toast("No hay recorrido guardado en este móvil");return false}
    pid=best.participantId;
    route=EVENT_DATA.routes.find(r=>r.participantId===pid&&(!best.routeId||r.routeId===best.routeId))||EVENT_DATA.routes.find(r=>r.participantId===pid);
    if(!route){if(!silent)toast("No se encuentra el recorrido guardado");return false}
    log=best;save();renderLoaded();if(!silent)toast("Recorrido restaurado correctamente");return true;
}

function renderLoaded(){document.getElementById("race").style.display="block";document.getElementById("identity").className="status ok";document.getElementById("identity").innerHTML="<b>"+pid+"</b> · "+route.routeId+" cargado";document.getElementById("route").innerHTML="<b>Orden obligatorio</b><br><div class='route'>"+route.points.join(" → ")+"</div>";renderNext();renderScans();renderResult();updateOfflineSafetyPanel("RECORRIDO GUARDADO EN ESTE MÓVIL")}
function scanControl(id){if(!route)return toast("Primero QR participante");if(id==="START")return startRace();if(id==="FINISH")return finishRace();if(!log.startTime)return toast("Primero SALIDA");if(log.finishTime)return toast("Ya finalizado");const exp=route.points.filter(x=>x!=="START"&&x!=="FINISH");const done=log.scans.filter(s=>s.status==="correct").length;const expected=exp[done]||"FINISH";const dup=log.scans.some(s=>s.controlId===id);let status=dup?"duplicate":id===expected?"correct":exp.includes(id)?"out_of_order":"wrong";log.scans.push({controlId:id,timestamp:new Date().toISOString(),expectedControlId:expected,status});save();renderNext();renderScans();toast(status==="correct"?"Baliza correcta":"Aviso: "+status)}
function startRace(){if(!route)return toast("Primero QR participante");if(log.startTime)return toast("Salida ya registrada");log.startTime=new Date().toISOString();save();renderNext();renderScans();toast("Salida registrada")}
function finishRace(){if(!route)return toast("Primero QR participante");if(!log.startTime)return toast("Primero SALIDA");const exp=route.points.filter(x=>x!=="START"&&x!=="FINISH");const done=log.scans.filter(s=>s.status==="correct").map(s=>s.controlId);log.missingControls=exp.filter(x=>!done.includes(x));log.finishTime=new Date().toISOString();log.completed=log.missingControls.length===0;log.resultPayload=resultPayload();save();renderNext();renderScans();renderResult();toast(log.completed?"Recorrido completo":"Llegada con pendientes")}
function save(){
    if(!log||!pid)return;
    log.lastSavedAt=safeNow();
    log.appVersion=APP_VERSION;
    const raw=JSON.stringify(log);
    try{
        writeKeyEverywhere(key()+"_"+pid,raw);
        writeKeyEverywhere(key(),raw);
        writeKeyEverywhere(key()+"_backup_"+pid,raw);
        writeKeyEverywhere(key()+"_backup_last",raw);
        writeKeyEverywhere(key()+"_emergency_"+pid,raw);
        writeKeyEverywhere(key()+"_emergency_last",raw);
        window.name="MILITOPO_RUN_BACKUP:"+raw;
    }catch(e){
        console.warn("No se pudo guardar registro offline",e);
    }
    updateOfflineSafetyPanel();
}
function renderNext(){const n=document.getElementById("next");if(!log.startTime){n.textContent="TE TOCA: SALIDA";return}if(log.finishTime){n.textContent=log.completed?"FINALIZADO OK":"FINALIZADO CON AVISOS";return}const exp=route.points.filter(x=>x!=="START"&&x!=="FINISH");const done=log.scans.filter(s=>s.status==="correct").length;n.textContent="TE TOCA: "+(exp[done]||"FINISH")}

function partialResultPayload(){

}

function resultPayload(){return btoa(unescape(encodeURIComponent(JSON.stringify({type:"ORI_RESULT",eventId:EVENT_DATA.eventId,participantId:pid,routeId:route.routeId,startTime:log.startTime,finishTime:log.finishTime,completed:log.completed,scans:log.scans.map(s=>({id:s.controlId,t:s.timestamp,st:s.status})),missingControls:log.missingControls||[]}))))}
async function renderResult(){const sec=document.getElementById("result");if(!log||!log.finishTime){sec.style.display="none";return}sec.style.display="block";const payload=log.resultPayload||resultPayload();const result="ORI|RESULT|"+EVENT_DATA.eventId+"|"+pid+"|"+payload;document.getElementById("summary").innerHTML="<b>"+pid+"</b> · "+route.routeId+"<br>"+(log.completed?"✅ Completo":"⚠️ Pendientes: "+(log.missingControls||[]).join(", "));document.getElementById("resultText").value=JSON.stringify({...log,result},null,2);try{const url=await QRCode.toDataURL(result,{margin:4,width:300,errorCorrectionLevel:"M"});document.getElementById("resultQr").innerHTML="<img src='"+url+"'><div class='result-qr-instruction'>📲 ENSEÑA ESTE QR DE RESULTADOS AL ORGANIZADOR<br>NO CIERRES ESTA PANTALLA HASTA QUE LO ESCANEEN</div>"}catch(e){document.getElementById("resultQr").innerHTML="<div class='status err'>No se pudo generar QR final</div>"}}
function copyResult(){const t=document.getElementById("resultText");t.select();document.execCommand("copy");toast("Copiado")}function downloadResult(){const b=new Blob([document.getElementById("resultText").value],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="resultado_"+(pid||"participante")+".json";a.click();URL.revokeObjectURL(a.href)}function tm(i){return new Date(i).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function bindParticipantAutosave(){
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save()});
    window.addEventListener("pagehide",save);
    window.addEventListener("beforeunload",save);
    window.addEventListener("offline",()=>updateOfflineSafetyPanel("SIN COBERTURA: EL RECORRIDO SIGUE GUARDADO"));
    window.addEventListener("online",()=>{updateOfflineSafetyPanel("COBERTURA RECUPERADA");precacheQrReader()});
    setInterval(save,4000);
}

function loadJsQr(){return new Promise(async(res,rej)=>{
    if(window.jsQR)return res(true);
    try{const ok=await precacheQrReader();if(ok)return res(true)}catch(e){}
    try{
        if(!navigator.onLine)return rej(new Error("Sin lector QR offline"));
        const s=document.createElement("script");
        s.src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
        s.onload=()=>{try{res(true)}catch(e){res(true)}};
        s.onerror=()=>rej(new Error("No se pudo cargar jsQR"));
        document.head.appendChild(s);
    }catch(e){rej(e)}
})}

async function startQrCamera(){
  const overlay=document.getElementById("cameraOverlay");
  const video=document.getElementById("video");
  const st=document.getElementById("camStatus");
  const title=document.getElementById("cameraTitle");

  if(title) title.textContent=route ? "ESCANEAR BALIZA / SALIDA / LLEGADA" : "ESCANEAR QR PARTICIPANTE";
  if(overlay) overlay.classList.add("active");
  if(st){st.className="status";st.textContent="Solicitando cámara...";}

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(st){st.className="status err";st.textContent="Este navegador no permite cámara. Usa MANUAL.";}
    return;
  }

  detector=null;useJsQr=false;

  if("BarcodeDetector" in window){
    try{detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){detector=null}
  }

  if(!detector){
    try{
      if(st)st.textContent="Cargando lector QR compatible...";
      await loadJsQr();
      useJsQr=!!window.jsQR;
    }catch(e){
      if(st){st.className="status err";st.textContent="Sin lector QR disponible offline en este navegador. Usa MANUAL o muestra el QR al organizador para rescate.";}
      return;
    }
  }

  try{
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    video.srcObject=stream;
    video.setAttribute("playsinline","");
    video.setAttribute("webkit-playsinline","");
    video.muted=true;
    video.autoplay=true;

    await video.play();

    running=true;last="";lastT=0;

    if(st){st.className="status ok";st.textContent="Cámara activa. Apunta al QR.";}

    setTimeout(()=>{try{video.play()}catch(e){}},250);
    loop();
  }catch(e){
    console.warn("Error cámara:",e);
    if(st){st.className="status err";st.textContent="No se pudo abrir o mostrar la cámara. Revisa permisos o usa MANUAL.";}
  }
}

function stopQrCamera(){
  running=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  const video=document.getElementById("video");
  if(video) video.srcObject=null;
  const overlay=document.getElementById("cameraOverlay");
  if(overlay) overlay.classList.remove("active");
}

async function loop(){
  if(!running)return;
  const video=document.getElementById("video"),canvas=document.getElementById("canvas"),st=document.getElementById("camStatus");
  try{
    let raw="";
    if(video&&video.readyState>=2){
      if(detector){
        const c=await detector.detect(video);
        if(c&&c.length)raw=(c[0].rawValue||"").trim();
      }else if(useJsQr&&window.jsQR&&canvas){
        const w=video.videoWidth||640,h=video.videoHeight||480;
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d",{willReadFrequently:true});
        ctx.drawImage(video,0,0,w,h);
        const img=ctx.getImageData(0,0,w,h);
        const code=window.jsQR(img.data,w,h,{inversionAttempts:"attemptBoth"});
        if(code&&code.data)raw=String(code.data).trim();
      }
    }

    if(raw){
      const now=Date.now();
      if(raw!==last||now-lastT>2500){
        last=raw;lastT=now;
        if(st){st.className="status ok";st.textContent="QR leído";}
        handleQr(raw);
        if(navigator.vibrate)navigator.vibrate(120);
        stopQrCamera();
      }
    }else if(st){
      st.className="status";
      st.textContent=(video&&video.videoWidth)? "Buscando QR..." : "Cámara abierta. Esperando imagen...";
    }
  }catch(e){
    if(st){st.className="status";st.textContent="Buscando QR...";}
  }
  if(running)requestAnimationFrame(loop)
}

init();
</script></body></html>
